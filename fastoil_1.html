<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fast Oil</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --fire1:#FF4500;--fire2:#FF6B00;--fire3:#FFA500;
  --dark:#0F0F0F;--dark2:#161616;--dark3:#1E1E1E;--dark4:#252525;
  --text:#FFFFFF;--text2:rgba(255,255,255,.65);--text3:rgba(255,255,255,.35);
  --green:#22C55E;--green-s:rgba(34,197,94,.12);
  --blue:#3B82F6;--blue-s:rgba(59,130,246,.12);
  --amber:#F59E0B;--amber-s:rgba(245,158,11,.12);
  --red-s:rgba(255,69,0,.12);
  --r:14px;--r-sm:10px;--r-xs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--dark);font-family:"Inter",sans-serif;color:var(--text);font-size:15px}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ROLE SELECT */
#screen-role{
  background:var(--dark);align-items:center;justify-content:center;padding:40px 24px;
  background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(255,90,0,.18) 0%,transparent 70%);
}
.logo-wrap{text-align:center;margin-bottom:44px}
.logo-img{width:96px;height:96px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 0 28px rgba(255,100,0,.55))}
.logo-title{font-size:30px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#FF8C00,#FF4500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:12px;color:var(--text3);margin-top:4px;letter-spacing:.8px;text-transform:uppercase}

.role-cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.role-card{
  border-radius:var(--r);padding:20px;cursor:pointer;
  display:flex;align-items:center;gap:16px;
  border:1px solid rgba(255,255,255,.08);background:var(--dark3);
  transition:all .15s;position:relative;overflow:hidden;
}
.role-card:active{transform:scale(.98);border-color:rgba(255,255,255,.15)}
.rc-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.role-card.driver .rc-icon{background:linear-gradient(135deg,#FF4500,#FF8C00)}
.role-card.manager .rc-icon{background:linear-gradient(135deg,#2563EB,#4F46E5)}
.rc-icon i{font-size:26px;color:#fff}
.rc-text h2{font-size:17px;font-weight:700}
.rc-text p{font-size:13px;color:var(--text2);margin-top:3px}
.rc-arrow{margin-left:auto;color:var(--text3);font-size:18px;flex-shrink:0}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;padding:13px 16px 11px;
  background:var(--dark2);border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:0;z-index:20;gap:10px;
}
.topbar-title{font-size:17px;font-weight:700;flex:1;letter-spacing:-.3px}
.topbar-sub{font-size:12px;color:var(--text3);font-weight:400}
.topbar-back{width:36px;height:36px;border:none;background:rgba(255,255,255,.07);border-radius:50%;display:flex;align-items:center;justify-content:center}
.topbar-back i{font-size:18px;color:var(--text2)}
.tlogo{width:28px;height:28px;object-fit:contain}
.topbar-add{
  padding:8px 14px;background:linear-gradient(135deg,#FF4500,#FF6B00);
  color:#fff;border:none;border-radius:var(--r-xs);
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;
  box-shadow:0 2px 14px rgba(255,69,0,.35);
}

/* TABS */
.tabs{display:flex;background:var(--dark2);border-bottom:1px solid rgba(255,255,255,.07)}
.tab-btn{
  flex:1;padding:12px 0;font-size:13px;font-weight:500;
  color:var(--text3);border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:color .15s;
}
.tab-btn.active{color:#FF8C00;border-bottom-color:#FF8C00}
.tab-badge{background:var(--fire1);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:12px 12px 80px;display:flex;flex-direction:column;gap:10px}

/* DAY BANNER */
.day-banner{
  background:var(--dark3);border-radius:var(--r);padding:18px;
  border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;
}
.day-banner::after{content:"";position:absolute;right:-20px;top:-20px;width:110px;height:110px;background:radial-gradient(circle,rgba(255,100,0,.18),transparent 70%);border-radius:50%}
.db-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.db-num{font-size:32px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#FF8C00,#FFB347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.db-stats{display:flex;gap:20px;margin-top:12px}
.db-stat-v{font-size:18px;font-weight:700}
.db-stat-l{font-size:11px;color:var(--text3)}
.route-btn{
  margin-top:14px;width:100%;padding:12px;
  background:rgba(255,100,0,.09);border:1px solid rgba(255,100,0,.22);
  border-radius:var(--r-sm);color:#FF9500;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.route-btn:active{background:rgba(255,100,0,.17)}
.route-btn i{font-size:16px}

/* ORDER CARD */
.order-card{
  background:var(--dark3);border-radius:var(--r);padding:15px;
  border:1px solid rgba(255,255,255,.07);
  border-left:3px solid rgba(255,255,255,.1);
  position:relative;
}
.order-card.status-new{border-left-color:rgba(245,158,11,.55)}
.order-card.status-go{border-left-color:rgba(59,130,246,.65);background:rgba(59,130,246,.04)}
.order-card.status-done{border-left-color:rgba(34,197,94,.45);opacity:.58}
.order-card.priority-urgent{border-left-color:rgba(255,69,0,.75)}

.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.avatar{
  width:42px;height:42px;min-width:42px;border-radius:50%;
  background:rgba(255,69,0,.14);border:1px solid rgba(255,69,0,.18);
  color:#FF8C00;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.card-meta{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--text3);margin-top:2px}

.sbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;vertical-align:middle}
.b-new{background:rgba(245,158,11,.12);color:#F59E0B}
.b-urgent{background:rgba(255,69,0,.12);color:#FF6B00}
.b-go{background:rgba(59,130,246,.12);color:#60A5FA}
.b-done{background:rgba(34,197,94,.12);color:#4ADE80}
.b-delayed{background:rgba(167,139,250,.1);color:#A78BFA}

.info-line{font-size:13px;color:var(--text2);margin-bottom:7px}
.info-line b{color:var(--text);font-weight:500}

.oil-chip{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,160,0,.09);border:1px solid rgba(255,160,0,.18);
  color:#FFB347;font-size:12px;font-weight:600;
  padding:5px 10px;border-radius:20px;margin-bottom:10px;
}
.oil-chip i{font-size:13px}

.note-box{
  background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.14);
  border-radius:var(--r-xs);padding:9px 11px;
  font-size:12px;color:#FCD34D;display:flex;gap:7px;margin-bottom:10px;
}
.call-btn{
  display:inline-flex;align-items:center;
  background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.2);
  color:#22C55E;font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:20px;white-space:nowrap;
  text-decoration:none;flex-shrink:0;
  transition:background .15s;
}
.call-btn:active{background:rgba(34,197,94,.22)}
.pour-box{
  background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.15);
  border-radius:var(--r-xs);padding:9px 11px;
  font-size:12px;color:#93C5FD;display:flex;gap:7px;align-items:flex-start;margin-bottom:10px;
}


.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.06);padding-top:11px;margin-bottom:11px;
}
.price-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.price-value{font-size:22px;font-weight:800;color:#FF8C00;letter-spacing:-.5px}

.card-actions{display:flex;gap:7px}
.btn{
  padding:11px 0;border-radius:var(--r-xs);font-size:13px;font-weight:600;
  border:none;display:flex;align-items:center;justify-content:center;gap:5px;
  transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(.97);opacity:.82}
.btn i{font-size:15px}
.btn-fire{background:linear-gradient(135deg,#FF4500,#FF8C00);color:#fff;flex:2;box-shadow:0 2px 12px rgba(255,69,0,.28)}
.btn-blue{background:rgba(59,130,246,.13);color:#60A5FA;border:1px solid rgba(59,130,246,.18);flex:2}
.btn-green{background:rgba(34,197,94,.11);color:#22C55E;border:1px solid rgba(34,197,94,.18);flex:2}
.btn-ghost{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid rgba(255,255,255,.09);flex:1}
.btn-amber{background:rgba(245,158,11,.11);color:#F59E0B;border:1px solid rgba(245,158,11,.18);flex:1}

.route-num{position:absolute;top:12px;right:13px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--text3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:var(--dark3);border-radius:var(--r);padding:15px;border:1px solid rgba(255,255,255,.07)}
.s-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.s-val{font-size:24px;font-weight:800;letter-spacing:-.5px}
.s-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sf .s-val{color:#FF8C00}
.sg .s-val{color:#22C55E}
.sb .s-val{color:#60A5FA}
.sa .s-val{color:#F59E0B}

.section-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:2px 0}

/* NOTIF */
.notif-banner{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.18);border-radius:var(--r-sm);padding:11px 14px;display:flex;align-items:center;gap:9px;font-size:13px;color:#4ADE80}
.notif-banner.nd{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.18);color:#A78BFA}
.notif-banner i{font-size:17px;flex-shrink:0}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-sheet{
  background:var(--dark2);border-radius:20px 20px 0 0;
  padding:20px 16px 36px;width:100%;max-height:92vh;overflow-y:auto;
  border-top:1px solid rgba(255,255,255,.1);
}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:20px;font-weight:800;margin-bottom:18px;letter-spacing:-.4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{margin-bottom:12px}
.fg label{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{
  width:100%;padding:12px 13px;border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-xs);font-size:14px;background:var(--dark3);color:var(--text);
  transition:border-color .15s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:rgba(255,100,0,.5)}
.fg select option{background:var(--dark3)}
.fg textarea{resize:vertical;min-height:68px}
.modal-actions{display:flex;gap:8px;margin-top:8px}
.modal-actions .btn{padding:14px 0;font-size:15px;border-radius:var(--r)}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px}
.empty-state i{font-size:52px;color:rgba(255,255,255,.1);margin-bottom:14px;display:block}
.empty-state h3{font-size:17px;font-weight:600;color:var(--text2)}
.empty-state p{font-size:13px;color:var(--text3);margin-top:5px}

/* TOAST */
.toast{
  position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--dark4);border:1px solid rgba(255,255,255,.1);
  color:var(--text);padding:11px 20px;border-radius:24px;
  font-size:13px;font-weight:500;z-index:99;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;
  white-space:nowrap;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* DAY ROW */
.day-row{background:var(--dark3);border-radius:var(--r-sm);padding:14px 16px;border:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center}
.day-row h4{font-size:14px;font-weight:600}
.day-row p{font-size:12px;color:var(--text3);margin-top:2px}
.day-row-r{font-size:17px;font-weight:800;color:#FF8C00}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
</style>
</head>

<script>
const DEPOT="г. Москва, Дмитровское шоссе, 65с4";
let role=null,dTab="today",mTab="today",editId=null;

const SB_URL="https://gxwqorynxfefvjlhnjqo.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4d3Fvcnl4ZmVmdmpsSG5qcW8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc0OTQ2MzAyNywiZXhwIjoyMDY1MDM5MDI3fQ.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4d3Fvcnl4ZmVmdmpsSG5qcW8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc0OTQ2MzAyNywiZXhwIjoyMDY1MDM5MDI3fQ";
const sbFetch=async(path,opts={})=>{
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=representation"}, ...opts});
    if(r.ok){const t=await r.text();return t?JSON.parse(t):[];}
    const err=await r.text();console.error("Supabase err:",r.status,err);return[];
  }catch(e){console.error("fetch err:",e);return[];}
};

// Local cache for speed
let _cache=null;
let _notifCache=JSON.parse(localStorage.getItem("fo_n")||"[]");

const ld=()=>_cache||[];
const ldN=()=>_notifCache;
const svN=n=>{_notifCache=n;localStorage.setItem("fo_n",JSON.stringify(n));};

async function loadFromDB(){
  try{
    const data=await sbFetch("orders?select=*&order=created_at.asc");
    if(Array.isArray(data)){_cache=data;return _cache;}
    else{console.error("DB error:",data);_cache=_cache||[];return _cache;}
  }catch(e){console.error("Network error:",e);_cache=_cache||[];return _cache;}
}

async function sv(orders){
  // Not used directly anymore - use sbSave/sbUpdate/sbDelete
  _cache=orders;
}

async function sbInsert(o){
  _cache=[...(ld()),o];
  await sbFetch("orders",{method:"POST",body:JSON.stringify(o)});
}

async function sbUpdate(id,fields){
  if(_cache){const i=_cache.findIndex(x=>x.id===id);if(i>=0)_cache[i]={..._cache[i],...fields};}
  await sbFetch("orders?id=eq."+id,{method:"PATCH",body:JSON.stringify(fields)});
}

async function sbDelete(id){
  if(_cache)_cache=_cache.filter(x=>x.id!==id);
  await sbFetch("orders?id=eq."+id,{method:"DELETE"});
}
const td=()=>new Date().toISOString().slice(0,10);
const tom=()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)};
const fd=s=>{if(!s)return"—";const t=td(),m=tom();if(s===t)return"Сегодня";if(s===m)return"Завтра";return new Date(s).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})};
const fp=p=>p?Number(p).toLocaleString("ru-RU")+" ₽":"—";
const ini=n=>{if(!n||!n.trim())return"?";const p=n.trim().split(" ");return p.length>1?(p[0][0]||"")+(p[1][0]||""):n.slice(0,2).toUpperCase()};
const sc=o=>{let s=0;if(o.priority==="urgent")s-=1e5;if(o.time){const[h,m]=o.time.split(":");s+=parseInt(h)*60+parseInt(m)}else s+=1440;return s};
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2800)}
function pN(type,o){const n=ldN();n.unshift({id:Date.now()+"",type,name:o.name,ts:new Date().toISOString()});if(n.length>50)n.pop();svN(n)}

function loginAs(r){
  role=r;
  document.getElementById("screen-role").classList.remove("active");
  document.getElementById("screen-"+r).classList.add("active");
  // Show loading
  const mainEl=document.getElementById(r==="driver"?"driver-main":"manager-main");
  mainEl.innerHTML='<div class="empty-state"><div style="color:var(--fire2);font-size:14px">Загрузка заказов…</div></div>';
  loadFromDB().then(()=>{r==="driver"?renderD():renderM();startRealtime();});
}
function goBack(){document.getElementById("screen-"+role).classList.remove("active");document.getElementById("screen-role").classList.add("active");role=null}
function openMap(o){window.open("https://yandex.ru/maps/?rtext="+encodeURIComponent(DEPOT)+"~"+encodeURIComponent(o.address)+"&rtt=auto","_blank")}
function openAll(){const orders=ld().filter(o=>o.date===td()&&o.status!=="done").sort((a,b)=>sc(a)-sc(b));if(!orders.length){toast("Нет активных заказов");return}let r=encodeURIComponent(DEPOT);orders.forEach(o=>r+="~"+encodeURIComponent(o.address));window.open("https://yandex.ru/maps/?rtext="+r+"&rtt=auto","_blank")}

function sdt(t){dTab=t;document.querySelectorAll("[data-dtab]").forEach(b=>b.classList.toggle("active",b.dataset.dtab===t));renderD()}
function renderD(){
  const orders=ld(),today=td(),el=document.getElementById("driver-main");
  document.getElementById("driver-date").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
  const act=orders.filter(o=>o.date===today&&o.status!=="done").sort((a,b)=>sc(a)-sc(b));
  document.getElementById("dtab-n").textContent=act.length;
  let h="";
  if(dTab==="today"){
    const dn=orders.filter(o=>o.date===today&&o.status==="done");
    const tp=act.reduce((s,o)=>s+(parseFloat(o.price)||0),0),dp=dn.reduce((s,o)=>s+(parseFloat(o.price)||0),0);
    if(act.length||dn.length){
      h+=`<div class="day-banner"><div class="db-label">Выручка за день</div><div class="db-num">${(tp+dp).toLocaleString("ru-RU")} ₽</div><div class="db-stats"><div><div class="db-stat-v">${act.length}</div><div class="db-stat-l">Осталось</div></div><div><div class="db-stat-v">${dn.length}</div><div class="db-stat-l">Сдано</div></div><div><div class="db-stat-v">${act.length+dn.length}</div><div class="db-stat-l">Всего</div></div></div>${act.length>1?`<button class="route-btn" onclick="openAll()"><i class="ti ti-map-route"></i> Весь маршрут в Яндекс Картах</button>`:""}</div>`;
      if(act.length){h+=`<div class="section-label">На доставку — ${act.length}</div>`;act.forEach((o,i)=>h+=dCard(o,i+1))}
      if(dn.length){h+=`<div class="section-label" style="margin-top:4px">Выполнено сегодня</div>`;dn.forEach(o=>h+=dCard(o,null))}
    }else h=emp("ti-check","На сегодня заказов нет","Менеджер пришлёт — они появятся здесь");
  }else if(dTab==="done"){
    const dn=orders.filter(o=>o.status==="done").sort((a,b)=>b.id.localeCompare(a.id));
    const tot=dn.reduce((s,o)=>s+(parseFloat(o.price)||0),0);
    if(dn.length){h+=`<div class="stats-grid"><div class="stat-card sg"><div class="s-label">Выполнено</div><div class="s-val">${dn.length}</div><div class="s-sub">доставок</div></div><div class="stat-card sa"><div class="s-label">Итого</div><div class="s-val">${Math.round(tot/1000)}к ₽</div><div class="s-sub">${tot.toLocaleString("ru-RU")} ₽</div></div></div>`;dn.forEach(o=>h+=dCard(o,null))}
    else h=emp("ti-list-check","Нет выполненных","");
  }else{
    const bD={};orders.forEach(o=>{if(!bD[o.date])bD[o.date]=[];bD[o.date].push(o)});
    const ds=Object.keys(bD).sort((a,b)=>b.localeCompare(a));
    if(ds.length)ds.forEach(date=>{const l=bD[date].sort((a,b)=>sc(a)-sc(b));const sum=l.reduce((s,o)=>s+(parseFloat(o.price)||0),0);h+=`<div class="section-label">${fd(date)} · ${l.length} зак. · ${sum.toLocaleString("ru-RU")} ₽</div>`;l.forEach(o=>h+=dCard(o,null))});
    else h=emp("ti-calendar","Нет заказов","");
  }
  el.innerHTML=h;
}

function dCard(o,num){
  const sb=o.status==="done"?`<span class="sbadge b-done">✓ Сдано</span>`:o.status==="go"?`<span class="sbadge b-go">▶ В пути</span>`:o.priority==="urgent"?`<span class="sbadge b-urgent">⚡ Срочно</span>`:o.status==="delayed"?`<span class="sbadge b-delayed">↷ Перенесён</span>`:`<span class="sbadge b-new">Новый</span>`;
  const qs=o.qty?` · ${o.qty} л`:"",ts=o.time?` · ${o.time}`:"";
  let acts="";
  if(o.status==="done")acts=`<div class="card-actions"><button class="btn btn-ghost" onclick="undoDone('${o.id}')">← Вернуть</button></div>`;
  else if(o.status==="go")acts=`<div class="card-actions"><button class="btn btn-blue" style="flex:2" onclick="openMap(${JSON.stringify(o).replace(/"/g,"&quot;")})">Карта</button><button class="btn btn-green" onclick="markDone('${o.id}')">✓ Доставлено</button><button class="btn btn-amber" onclick="delay('${o.id}')">↷</button></div>`;
  else acts=`<div class="card-actions"><button class="btn btn-fire" onclick="startDrive('${o.id}')">Ехать →</button><button class="btn btn-ghost" onclick="delay('${o.id}')">↷</button></div>`;
  return`<div class="order-card status-${o.status||"new"} priority-${o.priority||"normal"}">${num?`<div class="route-num">${num}</div>`:""}
    <div class="card-top"><div class="avatar">${ini(o.name)}</div><div class="card-meta"><div class="card-name">${o.name||"Клиент не указан"} ${sb}</div><div class="card-sub">${fd(o.date)}${ts}${o.phone?" · "+o.phone:""}</div></div></div>
    <div class="info-line" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <b style="flex:1">${o.address}</b>
      ${o.phone?`<a href="tel:${o.phone}" class="call-btn">Позвонить</a>`:""}
    </div>
    <span class="oil-chip">${o.oil}${qs}</span>
    ${o.pour?`<div class="pour-box">${o.pour}</div>`:""}
    ${o.note?`<div class="note-box">${o.note}</div>`:""}
    <div class="card-footer"><div class="price-label">Стоимость</div><div class="price-value">${fp(o.price)}</div></div>
    ${acts}</div>`;
}

async function startDrive(id){const x=ld().find(v=>v.id===id);if(!x)return;await sbUpdate(id,{status:"go"});openMap(x);renderD();toast("🚗 Едем!")}
async function markDone(id){const x=ld().find(v=>v.id===id);if(!x)return;const doneAt=new Date().toISOString();await sbUpdate(id,{status:"done"});pN("done",x);renderD();if(role==="manager")renderM();toast("✅ Доставлено! Менеджер уведомлён")}
async function undoDone(id){await sbUpdate(id,{status:"new"});renderD();toast("Статус возвращён")}
async function delay(id){if(!confirm("Перенести на завтра?"))return;const x=ld().find(v=>v.id===id);if(!x)return;await sbUpdate(id,{date:tom(),status:"delayed"});pN("delayed",x);renderD();if(role==="manager")renderM();toast("📅 Перенесён на завтра")}

function smt(t){mTab=t;document.querySelectorAll("[data-mtab]").forEach(b=>b.classList.toggle("active",b.dataset.mtab===t));renderM()}
function renderM(){
  const orders=ld(),notifs=ldN(),today=td(),el=document.getElementById("manager-main");
  let h="";
  if(mTab==="today"){
    const tO=orders.filter(o=>o.date===today).sort((a,b)=>sc(a)-sc(b));
    const fresh=notifs.filter(n=>(new Date()-new Date(n.ts))<10800000);
    fresh.forEach(n=>{
      if(n.type==="done")h+=`<div class="notif-banner"><i class="ti ti-bell-ringing"></i><span><b>${n.name}</b> — заказ доставлен ✅</span></div>`;
      else h+=`<div class="notif-banner nd">↷<span><b>${n.name}</b> — перенесён на завтра</span></div>`;
    });
    const sum=tO.reduce((s,o)=>s+(parseFloat(o.price)||0),0),done=tO.filter(o=>o.status==="done").length;
    h+=`<div class="stats-grid">
      <div class="stat-card sf"><div class="s-label">Всего сегодня</div><div class="s-val">${tO.length}</div><div class="s-sub">заказов</div></div>
      <div class="stat-card sa"><div class="s-label">Сумма дня</div><div class="s-val">${Math.round(sum/1000)}к ₽</div><div class="s-sub">${sum.toLocaleString("ru-RU")} ₽</div></div>
      <div class="stat-card sg"><div class="s-label">Доставлено</div><div class="s-val">${done}</div><div class="s-sub">выполнено</div></div>
      <div class="stat-card sb"><div class="s-label">В работе</div><div class="s-val">${tO.length-done}</div><div class="s-sub">осталось</div></div>
    </div>`;
    if(tO.length){h+=`<div class="section-label">Заказы на сегодня</div>`;tO.forEach(o=>h+=mCard(o))}
    else h+=emp("ti-list","Заказов на сегодня нет","Нажмите «Заказ» чтобы добавить");
  }else if(mTab==="stats"){
    const all=orders,bD={};all.forEach(o=>{if(!bD[o.date])bD[o.date]=[];bD[o.date].push(o)});
    const ds=Object.keys(bD).sort((a,b)=>b.localeCompare(a)).slice(0,14);
    const totAll=all.reduce((s,o)=>s+(parseFloat(o.price)||0),0),doneAll=all.filter(o=>o.status==="done");
    h+=`<div class="stats-grid">
      <div class="stat-card sf"><div class="s-label">Всего заказов</div><div class="s-val">${all.length}</div></div>
      <div class="stat-card sg"><div class="s-label">Выполнено</div><div class="s-val">${doneAll.length}</div></div>
      <div class="stat-card sa" style="grid-column:span 2"><div class="s-label">Общая выручка</div><div class="s-val" style="font-size:28px">${totAll.toLocaleString("ru-RU")} ₽</div></div>
    </div>`;
    if(ds.length){h+=`<div class="section-label">По дням</div>`;ds.forEach(date=>{const l=bD[date];const sum=l.reduce((s,o)=>s+(parseFloat(o.price)||0),0);const dn=l.filter(o=>o.status==="done").length;h+=`<div class="day-row"><div><h4>${fd(date)}</h4><p>${l.length} заказов · ${dn} выполнено</p></div><div class="day-row-r">${sum.toLocaleString("ru-RU")} ₽</div></div>`})}
  }else{
    const all=orders.sort((a,b)=>b.id.localeCompare(a.id));
    if(all.length){const bD={};all.forEach(o=>{if(!bD[o.date])bD[o.date]=[];bD[o.date].push(o)});Object.keys(bD).sort((a,b)=>b.localeCompare(a)).forEach(date=>{const l=bD[date];const sum=l.reduce((s,o)=>s+(parseFloat(o.price)||0),0);h+=`<div class="section-label">${fd(date)} · ${sum.toLocaleString("ru-RU")} ₽</div>`;l.sort((a,b)=>sc(a)-sc(b)).forEach(o=>h+=mCard(o))})}
    else h=emp("ti-calendar","Заказов пока нет","Создайте первый заказ");
  }
  el.innerHTML=h;
}

function mCard(o){
  const sb=o.status==="done"?`<span class="sbadge b-done">✓ Доставлено</span>`:o.status==="go"?`<span class="sbadge b-go">▶ В пути</span>`:o.priority==="urgent"?`<span class="sbadge b-urgent">⚡ Срочно</span>`:o.status==="delayed"?`<span class="sbadge b-delayed">↷ Перенесён</span>`:`<span class="sbadge b-new">Новый</span>`;
  const qs=o.qty?` · ${o.qty} л`:"",ts=o.time?` · ${o.time}`:"";
  return`<div class="order-card status-${o.status||"new"} priority-${o.priority||"normal"}">
    <div class="card-top"><div class="avatar">${ini(o.name)}</div><div class="card-meta"><div class="card-name">${o.name||"Клиент не указан"} ${sb}</div><div class="card-sub">${fd(o.date)}${ts}${o.phone?" · "+o.phone:""}</div></div></div>
    <div class="info-line" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <b style="flex:1">${o.address}</b>
      ${o.phone?`<a href="tel:${o.phone}" class="call-btn">Позвонить</a>`:""}
    </div>
    <span class="oil-chip">${o.oil}${qs}</span>
    ${o.pour?`<div class="pour-box">${o.pour}</div>`:""}
    ${o.note?`<div class="note-box">${o.note}</div>`:""}
    <div class="card-footer"><div class="price-label">Стоимость</div><div class="price-value">${fp(o.price)}</div></div>
    <div class="card-actions">
      <button class="btn btn-ghost" onclick="openEdit('${o.id}')"><i class="ti ti-edit"></i> Изм.</button>
      ${o.status!=="done"?`<button class="btn btn-amber" onclick="postponeM('${o.id}')">↷ Завтра</button>`:""}
      <button class="btn btn-ghost" onclick="delO('${o.id}')"><i class="ti ti-trash"></i></button>
    </div></div>`;
}

async function postponeM(id){if(!confirm("Перенести на завтра?"))return;await sbUpdate(id,{date:tom(),status:"delayed"});renderM();toast("📅 Перенесён на завтра")}
async function delO(id){if(!confirm("Удалить заказ?"))return;await sbDelete(id);renderM();toast("Удалено")}

function openAdd(){editId=null;["f-name","f-phone","f-addr","f-oil","f-qty","f-pour","f-time","f-price","f-note"].forEach(id=>document.getElementById(id).value="");document.getElementById("f-date").value=td();document.getElementById("f-priority").value="normal";document.getElementById("modal-title").textContent="Новый заказ";document.getElementById("add-modal").classList.add("open")}
function openEdit(id){const x=ld().find(o=>o.id===id);if(!x)return;editId=id;document.getElementById("f-name").value=x.name||"";document.getElementById("f-phone").value=x.phone||"";document.getElementById("f-addr").value=x.address||"";document.getElementById("f-oil").value=x.oil||"";document.getElementById("f-pour").value=x.pour||"";document.getElementById("f-qty").value=x.qty||"";document.getElementById("f-date").value=x.date||td();document.getElementById("f-time").value=x.time||"";document.getElementById("f-price").value=x.price||"";document.getElementById("f-priority").value=x.priority||"normal";document.getElementById("f-note").value=x.note||"";document.getElementById("modal-title").textContent="Изменить заказ";document.getElementById("add-modal").classList.add("open")}
function closeModal(){document.getElementById("add-modal").classList.remove("open")}
document.getElementById("add-modal").addEventListener("click",e=>{if(e.target===document.getElementById("add-modal"))closeModal()});

async function saveOrder(){
  const name=document.getElementById("f-name").value.trim(),addr=document.getElementById("f-addr").value.trim(),date=document.getElementById("f-date").value;
  if(!addr||!date){toast("⚠️ Заполните адрес и дату");return}
  if(editId){
    const fields={name,address:addr,date,phone:document.getElementById("f-phone").value.trim(),oil:document.getElementById("f-oil").value,pour:document.getElementById("f-pour").value.trim(),qty:document.getElementById("f-qty").value,time:document.getElementById("f-time").value,price:document.getElementById("f-price").value,priority:document.getElementById("f-priority").value,note:document.getElementById("f-note").value.trim()};
    await sbUpdate(editId,fields);toast("✏️ Заказ обновлён");
  }else{
    const o={id:Date.now()+"",name,address:addr,date,phone:document.getElementById("f-phone").value.trim(),oil:document.getElementById("f-oil").value,pour:document.getElementById("f-pour").value.trim(),qty:document.getElementById("f-qty").value,time:document.getElementById("f-time").value,price:document.getElementById("f-price").value,priority:document.getElementById("f-priority").value,note:document.getElementById("f-note").value.trim(),status:"new",created_at:new Date().toISOString()};
    await sbInsert(o);toast("✅ Заказ добавлен");
  }
  closeModal();renderM();
}

function emp(icon,title,sub){return`<div class="empty-state"><i class="ti ${icon}"></i><h3>${title}</h3><p>${sub}</p></div>`}

// Realtime polling every 15 seconds
let _realtimeTimer=null;
function startRealtime(){
  if(_realtimeTimer)clearInterval(_realtimeTimer);
  _realtimeTimer=setInterval(async()=>{
    await loadFromDB();
    if(role==="driver")renderD();
    else if(role==="manager")renderM();
  },15000);
}
</script>
</body>
</html>
